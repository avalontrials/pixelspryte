# PixelSpryte Configuration
# LLM backend: DeepSeek API (key loaded from .env — DEEPSEEK_API_KEY)

llm:
  backend: "openai_compatible"
  api_url: "https://api.deepseek.com/v1"
  api_key: ""                  # Leave empty — loaded from .env
  model_name: "deepseek-v4-pro"
  temperature: 0.3
  max_tokens: 4096
  top_p: 0.9

  # --- Legacy local backend (KoboldCPP + Qwen3-4B at C:\LLM) ---
  # backend: "koboldcpp"
  # api_url: "http://localhost:5001"
  # model_name: "Qwen3-4B-Q4_K_M"
  # rep_pen: 1.1
  # top_k: 40

brand:
  name: "Money Coach Reviews"
  font: "Montserrat-Bold"
  color_primary: "#00D1B2"
  color_secondary: "#111111"

source_files:
  # Drop clips in this folder — joined in filename order
  video_dir: "inputs/youtube"
  video_clips: []
  audio_master: ""
  script_reference: ""

audio:
  sync_method: "waveform"
  replace_camera_audio: false
  normalize: true
  target_lufs: -14

edit_defaults:
  style: "retention"
  target_minutes: 12
  allow_jumpcuts: true
  allow_zoom_ins: true
  zoom_max_scale: 1.15
  captions: "styled"        # none | srt | styled
  music: "uplift"           # none | uplift | ambient | drama
  broll: "finance"          # none | finance | generic | tech
  loudness_lufs: -14
  duck_db: -20
  remove_filler: true
  keep_structure:
    - "Hook"
    - "Claims"
    - "Proof"
    - "Price"
    - "Verdict"
    - "CTA"

editing_framework:
  phases:
    hook:
      duration_percent: [0, 12]
      avg_shot_length_seconds: [2, 4]
      energy_requirement: "high"
      priorities:
        - "match_expectations"
        - "front_load_intrigue"
        - "no_slow_burns"

    execution:
      duration_percent: [12, 60]
      avg_shot_length_seconds: [3, 6]
      reengagement_at_percent: 30
      priorities:
        - "show_dont_tell"
        - "rapid_progression"
        - "scene_variety"

    sustained_interest:
      duration_percent: [60, 80]
      avg_shot_length_seconds: [4, 8]
      reengagement_at_percent: 55
      priorities:
        - "story_momentum"
        - "visual_variety"
        - "never_signal_end"

    payoff:
      duration_percent: [80, 100]
      priorities:
        - "clear_payoff"
        - "abrupt_ending"

templates:
  youtube_longform_v1:
    structure: ["Hook", "Highlights", "Main", "CTA"]
    highlights:
      max_items: 5
      clip_len_seconds: [6, 10]
      transition_ms: 150
      music_bump: "assets/music/impact/impact_01.mp3"
      sfx_hit: "assets/sfx/hit_whoosh_01.wav"
      caption_style: "punchy"
    hook:
      max_duration_sec: 45
      allow_text_overlay: true
      require_payoff_reference: true

paths:
  project_root: "C:\\PixelSpryte"
  inputs_dir: "inputs/youtube"
  outputs_dir: "outputs/youtube"
  synced_name: "youtube_merged.mp4"
  edl_name: "youtube_edl.json"
  broll_dir: "assets/broll"
  music_dir: "assets/music"
  tags_csv: "assets/tags.csv"
  davinci_renders: "D:\\Davinci"

